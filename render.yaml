services:
  - type: web
    name: padakalam-app
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: padakalam-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: "ANVESHIPIN KANDETHUM"
      - key: NODE_ENV
        value: production

databases:
  - name: padakalam-db
    databaseName: padakalam
    user: padakalam_user
    plan: starter
